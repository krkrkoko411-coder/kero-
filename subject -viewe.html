<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المادة</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="sidebar" aria-label="التنقل الرئيسي">
        <h2>StudyMate</h2>
     
     <a href="index.html">🏠 الرئيسية</a>
        <a href="pomodoro.html">⏱️ Pomodoro</a>
        <a href="subjects.html">📚 المواد</a>
        <a href="planner.html">📅 Planner</a>
        <a href="daily-planner.html">🗓️ جدول اليوم</a>
        <a href="lessons.html">📖 دروس اليوم</a>
        <a href="goals.html">🎯 الأهداف الأسبوعية</a>
        <a href="notes.html">📝 الملاحظات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="profile.html">👤 الملف الشخصي</a>
    </nav>

<main>
    <section class="subject-details">

        <h1 id="subjectTitle">📚 المادة</h1>

        <div class="subject-progress">
            <h2>📊 التقدم</h2>

            <div class="progress-bar">
                <div id="subjectProgress"></div>
            </div>

            <p id="progressText">0%</p>
        </div>

        <div class="subject-stats">

            <div class="detail-card">
                <span>📖</span>
                <h3>الدروس</h3>
                <p><span id="completedLessons">0</span> / <span id="totalLessons">0</span></p>
            </div>

            <div class="detail-card">
                <span>📝</span>
                <h3>آخر امتحان</h3>
                <p id="lastExam">لا يوجد</p>
            </div>

            <div class="detail-card">
                <span>🎯</span>
                <h3>المتبقي</h3>
                <p id="remainingLessons">0 درس</p>
            </div>

            <div class="detail-card">
                <span>📅</span>
                <h3>الامتحان القادم</h3>
                <p id="nextExam">غير محدد</p>
            </div>

        </div>

        <a href="subjects.html" class="back-btn">⬅️ العودة للمواد</a>

    </section>
</main>

<script>
const subject = localStorage.getItem("selectedSubject");

document.getElementById("subjectTitle").textContent =
    subject ? `📚 ${subject}` : "📚 المادة";

if(subject){
    document.title = `${subject} - KiroHub`;
}
</script>
<script src="script.js"></script>
</body>
</html>
